name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: electronics_db
          POSTGRES_USER: electronics_user
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U electronics_user -d electronics_db"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      POSTGRES_DB: electronics_db
      POSTGRES_USER: electronics_user
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SECRET_KEY: ci-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with dev --no-interaction --no-ansi --no-root

      # Шаг ожидания удалили

      - name: Run tests with coverage
        run: |
          poetry run coverage run manage.py test networks -v 2
          poetry run coverage report -m

      - name: Generate coverage html
        if: always()
        run: |
          if [ -f .coverage ]; then poetry run coverage html; else echo "No .coverage file"; fi

      - name: Upload coverage html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
